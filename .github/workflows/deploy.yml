name: Build & Deploy
on:
  push:
    branches: [ master ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH to server and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            source ~/.bashrc
            echo "==== 进入服务器部署流程 ===="

            # 1. 如果不存在项目目录，clone仓库；存在就pull最新代码
            if [ ! -d "/home/${{ secrets.SSH_USER }}/qq-farm-bot-src" ]; then
              git clone https://github.com/Sheson98/qq-farm-bot.git /home/${{ secrets.SSH_USER }}/qq-farm-bot-src
            fi

            cd /home/${{ secrets.SSH_USER }}/qq-farm-bot-src
            git checkout master
            git pull origin master

            # 2. 安装依赖 + 构建（服务器本地执行pnpm build）
            cd core
            npm install -g pnpm@10
            pnpm install --frozen-lockfile
            pnpm run build

            # 3. 备份旧版本
            if [ -d "/home/${{ secrets.SSH_USER }}/qq-farm-bot" ]; then
              mv /home/${{ secrets.SSH_USER }}/qq-farm-bot /home/${{ secrets.SSH_USER }}/qq-farm-bot.bak.$(date +%Y%m%d_%H%M%S)
            fi

            # 4. 复制构建产物dist到运行目录
            mkdir -p /home/${{ secrets.SSH_USER }}/qq-farm-bot
            cp -r dist /home/${{ secrets.SSH_USER }}/qq-farm-bot/

            # 5. pm2重启bot
            echo "==== 重启pm2进程 ===="
            pm2 restart qq-farm-bot || pm2 start /home/${{ secrets.SSH_USER }}/qq-farm-bot/dist/index.js --name qq-farm-bot
            pm2 save
            echo "✅ 部署完成"
