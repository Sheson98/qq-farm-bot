name: Build & Deploy Docker
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DIR="/home/${{ secrets.SSH_USER }}/qq-farm-bot"
            GIT_REPO="https://gitee.com/sheson/qq-farm-bot.git"

            # 直接删除全局git配置文件，一次性清除ghproxy所有替换规则（治本）
            rm -f ~/.gitconfig

            # 如果目录存在，先检查；remote不对就整目录删除，彻底清除仓库内残留配置
            if [ -d "$DIR" ]; then
              cd $DIR
              # 获取origin地址
              REMOTE_URL=$(git remote get-url origin)
              echo "当前 origin = $REMOTE_URL"
              if [ "$REMOTE_URL" != "$GIT_REPO" ]; then
                echo "仓库地址异常，删除旧目录，重新从Gitee克隆"
                cd ~
                rm -rf $DIR
              fi
            fi

            # 目录不存在，全新克隆Gitee仓库
            if [ ! -d "$DIR" ]; then
              echo "开始从Gitee克隆代码"
              git clone --depth 1 $GIT_REPO $DIR
            fi

            cd $DIR
            git pull origin master

            docker compose up -d --build
            docker image prune -f
            echo "✅ 部署完成"
