name: Build & Deploy Docker
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DIR="/home/${{ secrets.SSH_USER }}/qq-farm-bot"
            GIT_REPO="https://gitee.com/sheson/qq-farm-bot.git"

            # 【同时清除 全局 + 当前仓库内 ghproxy 替换规则】
            git config --global --unset url."https://mirror.ghproxy.com/https://github.com/" || true
            git config --unset url."https://mirror.ghproxy.com/https://github.com/" || true

            if [ ! -d "$DIR" ]; then
              echo "目录不存在，从Gitee克隆仓库"
              git clone --depth 1 $GIT_REPO $DIR
            fi

            cd $DIR
            echo "===== 检查远程仓库remote地址 ====="
            REMOTE_URL=$(git remote get-url origin)
            echo "当前 origin 地址：$REMOTE_URL"

            # 判断，如果不是目标Gitee地址，自动修改remote
            if [ "$REMOTE_URL" != "$GIT_REPO" ]; then
              echo "remote地址不对，自动修改为Gitee地址"
              git remote set-url origin $GIT_REPO
            fi

            echo "拉取最新代码"
            git pull origin master

            echo "启动docker compose"
            docker compose up -d --build
            docker image prune -f
            echo "✅ 部署完成"
