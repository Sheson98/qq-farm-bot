name: Build & Deploy
on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 这里！！不要写 version:xx 这一行，直接删掉
          node-version: 20

      - name: Check pnpm version
        run: pnpm -v

      - name: Install dependencies and build
        run: |
          cd core
          pnpm install --frozen-lockfile
          pnpm run build
          cd dist
          tar -zcvf qq-farm-bot.tar.gz .

      - name: Upload zip & Unzip
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            # 备份
            if [ -d "/home/ubuntu/qq-farm-bot" ]; then
              mv /home/ubuntu/qq-farm-bot /home/ubuntu/qq-farm-bot.bak.$(date +%Y%m%d_%H%M%S)
            fi
            mkdir -p /home/ubuntu/qq-farm-bot
            cd /home/ubuntu/qq-farm-bot
            tar -zxvf /home/ubuntu/qq-farm-bot.tar.gz
            rm -f /home/ubuntu/qq-farm-bot.tar.gz
          # scp：本地 core/dist/qq-farm-bot.tar.gz 上传到服务器 /home/ubuntu/qq-farm-bot.tar.gz
          scp: |
            core/dist/qq-farm-bot.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/ubuntu/qq-farm-bot.tar.gz
