name: Build & Deploy
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # 重点：加上这一行！

      - name: Check pnpm version
        run: pnpm -v

      - name: Install dependencies and build
        run: |
          cd core
          pnpm install --frozen-lockfile
          pnpm run build
          # 在core目录打包dist文件夹，输出 core/qq-farm-bot.tar.gz
          tar -zcvf qq-farm-bot.tar.gz dist
          ls -la # 调试，看打包是否成功生成文件

      - name: Upload tar & Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          # scp 源路径修正：core/qq-farm-bot.tar.gz
          scp: |
            core/qq-farm-bot.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/ubuntu/qq-farm-bot.tar.gz
          script: |
            set -e
            # 备份旧程序
            if [ -d "/home/ubuntu/qq-farm-bot" ]; then
              mv /home/ubuntu/qq-farm-bot /home/ubuntu/qq-farm-bot.bak.$(date +%Y%m%d_%H%M%S)
            fi
            mkdir -p /home/ubuntu/qq-farm-bot
            cd /home/ubuntu/qq-farm-bot
            tar -zxvf /home/ubuntu/qq-farm-bot.tar.gz
            rm -f /home/ubuntu/qq-farm-bot.tar.gz
