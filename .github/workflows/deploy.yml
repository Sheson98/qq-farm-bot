name: Build & Deploy
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install & Build
        run: |
          cd core
          pnpm install --frozen-lockfile
          pnpm run build
          # 打包编译后的dist
          tar -zcvf dist.tar.gz dist
          ls -la

      # 上传打包文件到Github Artifact（临时存储，供服务器下载）
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-dist
          path: core/dist.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 下载刚才打包好的artifact到action runner
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bot-dist
          path: ./

      # 通过ssh登录服务器，curl从github artifact下载dist.tar.gz到服务器
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            source ~/.bashrc
            echo "=== 开始部署 ==="
            RUN_DIR="/home/${{ secrets.SSH_USER }}/qq-farm-bot"
            FILE="/home/${{ secrets.SSH_USER }}/dist.tar.gz"

            # 备份旧版本
            if [ -d "$RUN_DIR" ]; then
              mv $RUN_DIR ${RUN_DIR}.bak.$(date +%Y%m%d_%H%M%S)
            fi

            mkdir -p $RUN_DIR
            cd $RUN_DIR

            # 从Github Artifact下载打包好的dist压缩包
            curl -L -o $FILE ${{ steps.download-artifact.outputs.download-path }}/dist.tar.gz
            tar -zxvf $FILE
            rm -f $FILE

            echo "=== 重启pm2 ==="
            pm2 restart qq-farm-bot || pm2 start ${RUN_DIR}/dist/index.js --name qq-farm-bot
            pm2 save
            echo "✅ 部署完成"
